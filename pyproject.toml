# Partner Basecamp exercises — Python dependencies, installed into .venv by uv.
# Don't install these by hand: run  python3 basecamp_setup.py  (Windows: py basecamp_setup.py)
# from the repo root — it runs `uv sync` for you. Full guide: SETUP.md
#
# Floors guarantee the API surface the notebooks use; a fresh sync pulls the latest
# compatible release.

[project]
name = "basecamp-exercises"
version = "1.0.0"
description = "Partner Basecamp exercise notebooks"
requires-python = ">=3.10"
dependencies = [
    "anthropic[bedrock]>=1.6",   # every exercise; [bedrock] also covers Amazon Bedrock keys
    "python-dotenv>=1.0",        # every exercise: reads .env
    "truststore>=0.10",          # trusts the system certificate store (BASECAMP_TLS)
    "ipykernel>=6",              # the "Anthropic Basecamp (.venv)" notebook kernel
    "matplotlib>=3.7",           # Day 1/03 Prompt Rescue
    "tabulate>=0.9",             # Day 2/02 Inference Optimization
]

[tool.uv]
package = false  # a set of notebooks, not an installable package
